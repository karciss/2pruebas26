name: CI backend y frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
    steps:
      - name: Obtener código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar backend
        run: python -m pip install -r requirements.txt

      - name: Instalar frontend
        run: npm ci --prefix frontend

      - name: Construir frontend
        run: npm run build --prefix frontend

      - name: Pruebas unitarias y de integración
        run: python -m pytest -q backend/tests

      - name: Instalar Chromium
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Prueba E2E
        run: npm run test:e2e --prefix frontend

      - name: Verificar db.json
        run: git diff --exit-code -- backend/db.json
